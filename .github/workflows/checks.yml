name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m venv /tmp/release-tools && /tmp/release-tools/bin/pip install 'cryptography==45.0.7'
      - run: /tmp/release-tools/bin/python -m unittest discover -s scripts/release -p 'test_*.py'
      - run: node --test scripts/release/test_downloads.mjs
      - run: scripts/test.sh
