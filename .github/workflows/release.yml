name: Release stable and beta
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'apotenza92/simple-mac-keyboard-control'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install 'cryptography==45.0.7'
      - name: Validate release source and notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          python3 - "$RELEASE_TAG" <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'scripts/release')
          from contract import parse_tag
          tag = parse_tag(sys.argv[1])['tag']
          notes = pathlib.Path('release-notes') / (tag + '.md')
          if not notes.is_file() or not notes.read_text().strip():
              raise SystemExit('Add reviewed release-notes/' + tag + '.md before tagging')
          PY
      - id: meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: echo "matrix=$(python3 scripts/release/contract.py "$RELEASE_TAG" --matrix)" >> "$GITHUB_OUTPUT"
  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
      - name: Native tests and development build
        run: scripts/test.sh
      - name: Sign, notarize, and verify package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_CHANNEL: ${{ matrix.channel }}
          APPLE_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_NOTARYTOOL_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARYTOOL_KEY_P8_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARYTOOL_KEY_ID: ${{ vars.APPLE_NOTARYTOOL_KEY_ID }}
          APPLE_NOTARYTOOL_ISSUER_ID: ${{ vars.APPLE_NOTARYTOOL_ISSUER_ID }}
        run: scripts/release/ci-package.sh "$RELEASE_TAG" "$RELEASE_CHANNEL"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.channel }}-${{ matrix.arch }}
          path: build/releases/${{ github.ref_name }}/
          if-no-files-found: error
  draft:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Verify exact asset set and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - "$RELEASE_TAG" <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'scripts/release')
          from contract import parse_tag, package
          expected = set()
          for channel in parse_tag(sys.argv[1])['channels']:
              for arch in ['arm64', 'x64']:
                  asset = package(sys.argv[1], channel, arch)['asset']
                  expected.update([asset, asset + '.sha256', asset + '.notary.json'])
          actual = {p.name for p in pathlib.Path('dist').iterdir() if p.is_file()}
          if expected != actual:
              raise SystemExit('Release asset set does not match the contract')
          PY
          (cd dist && sha256sum -c -- *.sha256)
          prerelease=()
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft "${prerelease[@]}" \
            --title "$RELEASE_TAG" --notes-file "release-notes/$RELEASE_TAG.md"
  sign-publication:
    needs: draft
    runs-on: ubuntu-latest
    environment: sparkle-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install 'cryptography==45.0.7'
      - name: Sign exact update archives and seal Homebrew manifest
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release/prepare_publication.py "$RELEASE_TAG" dist publication-output
      - uses: actions/upload-artifact@v4
        with:
          name: signed-publication
          path: publication-output
          if-no-files-found: error
  validate:
    name: Validate packages (${{ matrix.arch }})
    needs: [prepare, sign-publication]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: macos-15}
          - {arch: x64, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: signed-publication
          path: publication-output
      - run: python3 -m venv /tmp/release-tools && /tmp/release-tools/bin/pip install 'cryptography==45.0.7'
      - name: Validate generated cask style
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew style publication-output/publication/Casks/*.rb
      - name: Validate signatures, notarization, identity, and architecture
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ARCH: ${{ matrix.arch }}
          APPLE_SIGNING_IDENTITY: 'Developer ID Application: Alexander Potenza (27JL2VERNC)'
          APPLE_TEAM_ID: '27JL2VERNC'
          APPLE_SIGNING_CERTIFICATE_SHA256: C20E3A100252224861FF8474DEBB21E5A120210E7CD61905EFDA0B6464E18594
        run: |
          for channel in $(python3 -c 'import sys; sys.path.insert(0,"scripts/release"); from contract import parse_tag; print(" ".join(parse_tag(sys.argv[1])["channels"]))' "$RELEASE_TAG"); do
            /tmp/release-tools/bin/python scripts/release/verify_package.py "$RELEASE_TAG" "$channel" "$RELEASE_ARCH" dist publication-output/appcasts
          done
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ contains(github.ref_name, '-beta.') && 'beta-release' || 'stable-release' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: signed-publication
          path: publication-output
      - name: Require hardware release verification
        env:
          VERIFIED_COMMIT: ${{ vars.HARDWARE_VERIFIED_COMMIT }}
        run: test "$VERIFIED_COMMIT" = "$GITHUB_SHA"
      - name: Attest reviewed Homebrew bundle
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: publication-output/homebrew-publication.tar.gz
      - name: Publish immutable release and matching feeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          mkdir -p appcasts
          python3 scripts/release/install_feeds.py publication-output/appcasts appcasts
          gh release upload "$RELEASE_TAG" publication-output/homebrew-publication.tar.gz
          gh release edit "$RELEASE_TAG" --draft=false
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add appcasts
          git commit -m "Publish update feeds for $RELEASE_TAG"
          git push origin HEAD:main
      - name: Verify public release and feeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          for file in appcasts/*.xml; do
            curl --fail --location --retry 5 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$(git rev-parse HEAD)/appcasts/$(basename "$file")" -o /tmp/feed.xml
            cmp "$file" /tmp/feed.xml
          done
